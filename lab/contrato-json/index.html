<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contrato JSON · tufenor</title>
  <link rel="stylesheet" href="../../assets/portfolio.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="wrap site-header"><a href="../../">← Portfólio</a></header>
  <main class="wrap">
    <div class="intro">
      <h1>Contrato JSON</h1>
      <p>Defina os campos obrigatórios e verifique o tipo de cada valor. O conteúdo fica nesta página.</p>
    </div>
    <form id="verificador">
      <p id="tipos">Tipos disponíveis: string, number, integer, boolean, object, array e null. Campos extras são permitidos.</p>
      <div class="editors">
        <div class="editor">
          <label for="contrato">Contrato</label>
          <textarea id="contrato" aria-describedby="tipos" spellcheck="false">{
  "id": "integer",
  "titulo": "string",
  "publicado": "boolean"
}</textarea>
        </div>
        <div class="editor">
          <label for="exemplo">Exemplo de resposta</label>
          <textarea id="exemplo" spellcheck="false">{
  "id": 1,
  "titulo": "Projeto de demonstração",
  "publicado": true
}</textarea>
        </div>
      </div>
      <button type="submit">Verificar exemplo</button>
    </form>
    <div id="resultado">
      <p id="status" role="status" aria-atomic="true"></p>
      <ul id="erros" hidden></ul>
    </div>
  </main>
</body>
</html>
